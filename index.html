<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap">
<style>
body{margin:0;background:#15121C;color:#F6F5F8;font-family:Helvetica,Arial,sans-serif}
a{color:#F2C55A}a:hover{color:#FFFFFF}
main{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;box-sizing:border-box}

.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sky>div{position:absolute;transform:rotate(155deg);transform-origin:0 0}
.meteor{height:1.5px;border-radius:1px;background:linear-gradient(to right,transparent,#FFFFFF);opacity:0;animation:meteor linear infinite}
.meteor.gold{background:linear-gradient(to right,transparent,#FFE7A3)}

.content{position:relative;display:flex;flex-direction:column;align-items:center;gap:56px}
.brand{display:flex;align-items:center;gap:44px;flex-wrap:wrap;justify-content:center}

.emblem{width:180px;height:180px;perspective:700px;flex:none}
.emblem>div{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateZ(-22deg) rotateX(72deg);animation:ringTilt 4.5s ease-in-out infinite alternate}
.ring{position:absolute;left:11px;top:11px;width:158px;height:158px;border-radius:50%;background:conic-gradient(from 0deg,#B9831C,#E2AE3C 25%,#FFE7A3 38%,#F2C55A 46%,#D19A28 70%,#B9831C);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 12px));mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 12px));animation:ringSpin 3.2s linear infinite}
.star{position:absolute;inset:0;transform:translateZ(0);filter:drop-shadow(0 6px 10px rgba(0,0,0,0.5));animation:starFloat 3.6s ease-in-out infinite alternate}
.star>div{position:absolute;inset:0}

.divider{width:3px;height:120px;background:#7B4FD6;flex:none}
.logo{font-family:'Unbounded',sans-serif;font-size:clamp(36px,6vw,68px);line-height:1;letter-spacing:0.03em;display:flex;align-items:baseline}
.logo b{font-weight:700;color:#F6F5F8}
.logo span{font-weight:500;color:#A57CF2}

.links{display:flex;align-items:center;gap:18px}
.links a{width:48px;height:48px;border-radius:50%;border:1px solid #3A2C5C;background:rgba(123,79,214,0.06);color:#FFFFFF;display:flex;align-items:center;justify-content:center;transition:color .2s,border-color .2s,transform .2s}
.links a:hover{border-color:#7B4FD6;transform:translateY(-2px)}
.dot{width:4px;height:4px;border-radius:50%;background:#4A3F5E}

@keyframes ringSpin{to{transform:rotateZ(360deg)}}
@keyframes ringTilt{0%{transform:rotateZ(-22deg) rotateY(-28deg) rotateX(72deg)}100%{transform:rotateZ(-22deg) rotateY(28deg) rotateX(72deg)}}
@keyframes starFloat{0%{transform:translateZ(0) translateY(-3px) rotateY(-14deg) rotateZ(-3deg)}100%{transform:translateZ(0) translateY(3px) rotateY(14deg) rotateZ(3deg)}}
@keyframes meteor{0%{transform:translateX(0);opacity:0}2%{opacity:0.9}9%{transform:translateX(380px);opacity:0}100%{transform:translateX(380px);opacity:0}}
@media (prefers-reduced-motion:reduce){.meteor,.tilt,.ring,.star{animation:none!important}}
</style>
</head>

          </div>
        </div>
      </div>
